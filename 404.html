<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Your Name</title>
<meta name="robots" content="noindex">
<!-- Paths are prefixed with the repo name because this is a GitHub Pages
     *project* site served from /krnes/. On a custom domain or a
     user/org site served from the root, drop the /krnes prefix. -->
<link rel="icon" href="/krnes/assets/img/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Inter:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/krnes/assets/css/styles.css">
<style>
  .notfound { min-height: 100vh; display: grid; place-items: center; text-align: center; }
  .notfound__code {
    font-family: var(--font-display); font-size: clamp(5rem, 20vw, 10rem);
    font-weight: 600; line-height: 1; color: var(--accent); letter-spacing: -.05em;
  }
</style>
</head>
<body>
  <main class="notfound">
    <div class="container">
      <p class="notfound__code">404</p>
      <h1 class="section__title" style="margin-bottom: var(--space-4)">This page wandered off</h1>
      <p class="section__lead" style="margin-inline: auto">
        The link may be old, or I may have moved something. Either way, let's get you back.
      </p>
      <p style="margin-top: var(--space-6)">
        <a class="btn btn--primary" href="/krnes/">Back to home</a>
      </p>
    </div>
  </main>
</body>
</html>
